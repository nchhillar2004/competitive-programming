# cstat configuration

# Path to scan
path = .
# Processor threads (0 = auto)
threads = 0

# File size limits (MB)
min_file_size = 0
max_file_size = 5

json_output = false
csv_output = false
use_gitignore = true
scan_fast = false
quiet = false

# Append comma separated custom excludes
excluded_dirs = 
excluded_extensions = 

# Default excludes (do not edit)
default_excluded_dirs = .git,.hg,.sv,.bzr,node_modules,.venv,venv,build,env,.cargo,.vs,__pycache__,.idea,.vscode,.gradle,.maven,.terraform,.cache,.out,target,dist
default_excluded_extensions = min.js,min.css,bundle.js,bin,dat,exe,dll,so,class,iso,o,out